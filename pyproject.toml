[project]
name = "aiwritingindicator-13"
description = "uv package management for ai-writing-indicator project"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.3.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "py-vncorenlp>=0.1.4",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "underthesea>=9.5.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.1.0",
    "evaluate>=0.4.6",
    "google-genai>=2.33.0",
    "ipython>=9.17.1",
    "langdetect>=1.0.9",
    "matplotlib>=3.11.2",
    "pandarallel>=1.6.5",
    "rapidfuzz>=3.14.6",
    "requests[socks]>=2.34.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
    "shap>=0.54.1",
    "urllib3>=2.8.0",
    "wordcloud>=1.9.6",
]
